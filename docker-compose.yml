services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla
      POSTGRES_DB: dhaka_tesla_pool
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # No init scripts here any more: the API runs the tracked migration
      # runner (backend/scripts/migrate.js) on start, so the same mechanism
      # works on a fresh laptop, in CI and on Render.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://tesla:tesla@db:5432/dhaka_tesla_pool
      JWT_SECRET: change_me_dev_only
      JWT_EXPIRES_IN: 15m
      # Local convenience only. A real deployment sets RUN_MIGRATIONS=true and
      # SEED_REFERENCE=true but NEVER SEED_DEMO (public password, free money).
      RUN_MIGRATIONS: "true"
      SEED_REFERENCE: "true"
      SEED_DEMO: "true"
      SIMULATED_PAYMENTS: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — Next.js only reads
        # NEXT_PUBLIC_* vars at `next build`, not at container start, so this
        # has to be a build arg rather than a runtime `environment:` entry.
        # Value is the browser's own view of the API (host-mapped port),
        # not the internal Docker network hostname.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db_data:
