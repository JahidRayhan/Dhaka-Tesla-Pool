services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla
      POSTGRES_DB: dhaka_tesla_pool
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Postgres's official image runs every .sql file directly inside this
      # directory, in filename order, ONLY on first init (empty data dir) —
      # it does NOT recurse into subfolders, so each file is bind-mounted
      # individually to keep migrations/ and seed/ as separate folders in
      # the repo while still flattening correctly for Docker. That's also
      # why this is plain numbered SQL rather than a migration tool for the
      # MVP — see README "Tech Choices" for the trade-off.
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      # Mount target filenames control execution order here, not the source
      # filenames — migrations/ and seed/ number independently within their
      # own folders (both happen to have a "002_"), so the container-side
      # names are renumbered to guarantee migrations run before the seed.
      - ./migrations/002_add_pending_confirmation_status.sql:/docker-entrypoint-initdb.d/002_migration.sql:ro
      - ./migrations/003_add_zone_routing.sql:/docker-entrypoint-initdb.d/003_migration.sql:ro
      - ./migrations/004_add_pool_join_consents.sql:/docker-entrypoint-initdb.d/004_migration.sql:ro
      - ./seed/002_seed.sql:/docker-entrypoint-initdb.d/005_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://tesla:tesla@db:5432/dhaka_tesla_pool
      JWT_SECRET: change_me_dev_only
      JWT_EXPIRES_IN: 7d
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — Next.js only reads
        # NEXT_PUBLIC_* vars at `next build`, not at container start, so this
        # has to be a build arg rather than a runtime `environment:` entry.
        # Value is the browser's own view of the API (host-mapped port),
        # not the internal Docker network hostname.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db_data:
